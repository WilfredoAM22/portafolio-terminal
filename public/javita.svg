<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Javita, la mascota de madebywilfrd</title>
  <style>
    :root { --javita: #F89820; --vapor: #7fa3b3; --ojos: #cfeaf5; }
    .vapor { animation: vapor 3.2s ease-in-out infinite; }
    .vapor-b { animation-delay: 1.1s; }
    .ojos { transform-box: fill-box; transform-origin: center; animation: parpadeo 5s infinite; }
    @keyframes vapor { 0%, 100% { transform: translateY(0); opacity: .35; } 50% { transform: translateY(-2px); opacity: .9; } }
    @keyframes parpadeo { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
    @media (prefers-reduced-motion: reduce) { .vapor, .ojos { animation: none; } }
  </style>
  <!-- Vapor -->
  <g stroke="var(--vapor)" stroke-width="2.5">
    <path class="vapor" d="M24 20c-3-3 3-5 0-9"/>
    <path class="vapor vapor-b" d="M34 20c-3-3 3-5 0-9"/>
  </g>
  <!-- Taza -->
  <g stroke="var(--javita)" stroke-width="3">
    <path d="M12 26h32v14a12 12 0 0 1-12 12h-8a12 12 0 0 1-12-12z" fill="var(--javita)" fill-opacity=".14"/>
    <path d="M44 30h4a6 6 0 0 1 0 12h-4"/>
    <path d="M8 57h40"/>
  </g>
  <!-- Mejillas -->
  <g fill="var(--javita)" fill-opacity=".35" stroke="none">
    <circle cx="17.5" cy="40" r="2"/>
    <circle cx="38.5" cy="40" r="2"/>
  </g>
  <!-- Cara -->
  <g stroke="var(--ojos)" stroke-width="3">
    <g class="ojos"><path d="M22 34v3"/><path d="M34 34v3"/></g>
    <path d="M25.5 42q2.5 2 5 0" stroke-width="2.5"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
